<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drug Recall Classifier</title>
    <script>
      // Before the first paint, apply the saved theme, palette and motion setting (keys: src/lib/theme.ts,
      // palette.ts, motionPref.ts). Defaults: light, Lagoon, Auto (follows the OS reduce-motion setting).
      ;(function () {
        var d = document.documentElement
        var osReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches
        d.dataset.palette = 'lagoon'
        d.dataset.motion = osReduced ? 'reduced' : 'full'
        try {
          var s = window.localStorage
          if (s.getItem('recall-theme') === 'dark') d.classList.add('dark')
          var p = s.getItem('recall-palette')
          if (p === 'lavender' || p === 'sage') d.dataset.palette = p
          var m = s.getItem('recall-motion')
          if (m === 'full' || m === 'reduced') d.dataset.motion = m
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
